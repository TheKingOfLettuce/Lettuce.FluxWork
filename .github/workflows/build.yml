name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    uses: TheKingOfLettuce/LettuceGithubWorkflows/.github/workflows/Build-dotnet.yml@main
    with:
      dotnet-version: 9.0.x
      configuration: Release
      project-path: Lettuce.FluxWork/Lettuce.FluxWork.csproj
  test:
    needs: build

    uses: TheKingOfLettuce/LettuceGithubWorkflows/.github/workflows/Test-dotnet.yml@main
    with:
      dotnet-version: 9.0.x
      configuration: Release
      project-path: Lettuce.FluxWork.Tests/Lettuce.FluxWork.Tests.csproj
